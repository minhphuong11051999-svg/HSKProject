# Nightly backup of the production database (Neon).
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL       the production connection string (same as on Render)
#   BACKUP_PASSPHRASE  a long password; backups are encrypted with it because
#                      this repository is public. Keep it somewhere safe —
#                      without it a backup cannot be opened.
#
# Each run uploads one encrypted file (artifact "db-backup-YYYY-MM-DD"), kept 90 days.
# To restore: download the artifact, then
#   gpg --batch --passphrase "$BACKUP_PASSPHRASE" -d hsk6-YYYY-MM-DD.dump.gpg > hsk6.dump
#   pg_restore --no-owner --no-privileges -d "<target database url>" hsk6.dump
name: Database backup

on:
  schedule:
    - cron: '0 17 * * *' # 00:00 Vietnam time
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the DATABASE_URL and BACKUP_PASSPHRASE repository secrets first."
            exit 1
          fi

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # pg_dump needs a direct connection, not Neon's pooler.
          PGURL=$(echo "$DATABASE_URL" | sed 's/-pooler\././')
          docker run --rm -e PGURL="$PGURL" -v "$PWD:/out" postgres:18 \
            sh -c 'pg_dump "$PGURL" -Fc --no-owner --no-privileges -f /out/hsk6.dump'
          size=$(stat -c %s hsk6.dump)
          echo "Dump size: $size bytes"
          [ "$size" -gt 10000 ] || { echo "::error::Dump looks empty"; exit 1; }

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          echo "STAMP=$(TZ=Asia/Ho_Chi_Minh date +%F)" >> "$GITHUB_ENV"
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o hsk6.dump.gpg hsk6.dump
          rm hsk6.dump

      - name: Rename
        run: mv hsk6.dump.gpg "hsk6-${STAMP}.dump.gpg"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: hsk6-*.dump.gpg
          retention-days: 90
          if-no-files-found: error
