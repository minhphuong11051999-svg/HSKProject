<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="/logo-64.png" />
<title>Belle Chinese Lab · Luyện viết HSK6</title>
<meta name="theme-color" content="#F3EFE4" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>
  (function () {
    var saved = localStorage.getItem('hsk6-theme');
    var theme = saved === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    // The palette is keyed off the .dark class (see index.css) so the Animate UI
    // theme wipe can flip it inside its view transition.
    document.documentElement.classList.toggle('dark', theme === 'dark');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
