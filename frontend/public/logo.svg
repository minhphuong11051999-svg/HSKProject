<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brush" x1="4" y1="52" x2="56" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8a33d" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="#11182a" />

  <!-- Brush stroke -->
  <path
    d="M16 44 C19 33 28 21 47 16"
