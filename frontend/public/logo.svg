<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Belle Chinese Lab">
  <!-- Belle Chinese Lab mark: a minimal red-crowned crane (丹顶鹤) on warm ivory -->
  <rect width="64" height="64" rx="15" fill="#F3EFE4"/>
  <!-- legs -->
  <path d="M29.6 43.4 L28.6 55.5 M33.2 43.2 L35.8 55.5" stroke="#77736B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- black tail plumes -->
  <path d="M21.5 36.8 C 16 37.4, 12 41.2, 10.2 47 C 13.6 45.9, 16.6 45.5, 19.2 44.8 C 17.8 46.4, 17.2 48, 17.2 49.6 C 21 47, 23.6 44.8, 24.8 42.4 Z" fill="#2B2926"/>
  <!-- body -->
  <path d="M16.5 38 C 21.5 30.5, 35 29, 41.6 34.6 C 41 40.6, 30 44.6, 21.2 42.1 C 18.8 41.4, 17.2 40, 16.5 38 Z" fill="#FFFFFF" stroke="#4E4B45" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- wing feather hint -->
  <path d="M23 36.6 C 28 34.3, 33.5 33.8, 38.4 35.2" stroke="#BDB6A8" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <!-- neck -->
  <path d="M38.6 34 C 33.6 27.4, 33.4 20.2, 38.4 14.6" stroke="#2B2926" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- head -->
  <circle cx="39.6" cy="13.4" r="2.5" fill="#2B2926"/>
  <!-- red crown -->
  <circle cx="40" cy="11.5" r="1.55" fill="#B8352E"/>
  <!-- beak -->
  <path d="M41.8 14 L49.6 16.8" stroke="#77736B" stroke-width="1.6" stroke-linecap="round"/>
</svg>
